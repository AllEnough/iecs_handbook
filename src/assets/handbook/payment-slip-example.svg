<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">郵局匯款單填寫範例</title>
  <desc id="desc">示意郵局匯款單中局號、帳號、戶名、金額、姓名、電話、身份證欄位與備註欄的位置。</desc>
  <rect width="900" height="620" fill="#f7fbf4"/>
  <rect x="24" y="24" width="852" height="572" fill="#f9fff4" stroke="#ef4444" stroke-width="3"/>
  <text x="450" y="58" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="28" font-weight="800" fill="#dc2626">郵政存簿儲金存款單（填寫範例）</text>

  <rect x="52" y="88" width="520" height="76" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="78" y="118" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#dc2626">郵局代號 / 帳號</text>
  <text x="78" y="148" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#18181b">700 00212560893462</text>

  <rect x="600" y="88" width="230" height="76" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="622" y="118" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#dc2626">存款金額</text>
  <text x="622" y="150" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="32" font-weight="900" fill="#18181b">2,500 元</text>

  <rect x="52" y="188" width="778" height="74" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="78" y="218" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#dc2626">戶名</text>
  <text x="160" y="218" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="22" font-weight="800" fill="#18181b">逢甲大學資訊工程系系學會</text>
  <text x="78" y="246" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#dc2626">經辦人</text>
  <text x="160" y="246" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="22" font-weight="800" fill="#18181b">歐俊緯</text>

  <rect x="52" y="286" width="778" height="58" fill="#ecfdf5" stroke="#22c55e" stroke-width="6"/>
  <text x="78" y="323" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="22" font-weight="900" fill="#166534">存款人姓名 / 身份證字號 / 電話：請填自己的資料</text>

  <rect x="52" y="368" width="520" height="142" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="78" y="405" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#dc2626">備註欄</text>
  <rect x="160" y="386" width="372" height="102" fill="#eff6ff" stroke="#06b6d4" stroke-width="6"/>
  <text x="188" y="430" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="30" font-weight="900" fill="#18181b">班級 / 姓名</text>
  <text x="188" y="468" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="28" font-weight="800" fill="#18181b">EX. 一甲歐俊緯</text>

  <rect x="600" y="368" width="230" height="142" fill="#18181b"/>
  <text x="622" y="406" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="20" font-weight="900" fill="#ffffff">填寫提醒</text>
  <text x="622" y="440" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="18" font-weight="800" fill="#86efac">綠色框：</text>
  <text x="700" y="440" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="18" fill="#ffffff">個人資料</text>
  <text x="622" y="474" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="18" font-weight="800" fill="#67e8f9">藍色框：</text>
  <text x="700" y="474" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="18" fill="#ffffff">班級與姓名</text>

  <text x="52" y="554" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="17" font-weight="700" fill="#52525b">此圖為填寫位置示意，實際格式請以郵局現場單據為準。</text>
</svg>
